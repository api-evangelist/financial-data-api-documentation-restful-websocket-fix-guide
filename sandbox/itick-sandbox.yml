summary: >-
  iTick provides a free-trial environment on a distinct host that mirrors the
  production REST and WebSocket surface. There are no synthetic test symbols,
  test clocks, or fixture tokens - the trial serves real market data at a reduced
  rate limit, authenticated with the same account API Key.
environments:
  - name: Free trial
    host: api-free.itick.org
    rest_base: https://api-free.itick.org/{product}
    websocket_base: wss://api-free.itick.org/{product}
    auth: Same `token` header / account API Key as production.
    note: >-
      Real (not mocked) data. The Free plan caps REST at 5 calls/minute, 1
      WebSocket connection, and 3 subscriptions, and is end-of-day for some data
      sets. See plans/itick-plans-pricing.yml.
  - name: Production
    host: api.itick.org
    rest_base: https://api.itick.org/{product}
    websocket_base: wss://api.itick.org/{product}
